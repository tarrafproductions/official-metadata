name: Validate JSON-LD

on:
  push:
    paths:
      - "**/*.jsonld"
      - ".github/scripts/*.py"
      - "exports/**"
      - "sources/**"
      - "assets/covers/**"
      - "docs/discography.md"
      - "docs/cover-*.md"
      - ".github/workflows/validate-jsonld.yml"
  pull_request:
    paths:
      - "**/*.jsonld"
      - ".github/scripts/*.py"
      - "exports/**"
      - "sources/**"
      - "assets/covers/**"
      - "docs/discography.md"
      - "docs/cover-*.md"
      - ".github/workflows/validate-jsonld.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate syntax and graph integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate JSON-LD
        run: python3 .github/scripts/validate_jsonld.py

      - name: Check reproducible catalog exports
        run: python3 .github/scripts/export_catalog.py --check

      - name: Check release artwork mapping and checksums
        run: python3 .github/scripts/build_cover_mapping.py --check

      - name: Check catalog integrity regressions
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
