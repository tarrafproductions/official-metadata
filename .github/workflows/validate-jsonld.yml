name: Validate JSON-LD

on:
  push:
    paths:
      - "**/*.jsonld"
      - ".github/scripts/validate_jsonld.py"
      - ".github/workflows/validate-jsonld.yml"
  pull_request:
    paths:
      - "**/*.jsonld"
      - ".github/scripts/validate_jsonld.py"
      - ".github/workflows/validate-jsonld.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate syntax and graph integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate JSON-LD
        run: python3 .github/scripts/validate_jsonld.py
